<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Hit TV</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#fff;color:#111;padding-bottom:80px}body.dark{background:#0a1931;color:#fff}#offlineBanner{display:none;background:#ffcc00;color:#000;text-align:center;padding:8px;font-weight:700;position:fixed;top:0;left:0;right:0;z-index:999}body.offline #offlineBanner{display:block}body.offline{padding-top:32px}#topBar{background:#0a1931;color:#fff;padding:12px 15px;display:flex;justify-content:space-between;align-items:center}#topBar h1{margin:0}#liveDot{color:#ff3b30;margin:0;font-size:12px;font-weight:700}#settingsBtn{background:#fff;color:#0a1931;border:0;padding:9px 14px;border-radius:20px;font-weight:700}#settingsBox{background:#f2f2f7;margin:10px;padding:15px;border-radius:16px;color:#000}.hidden{display:none!important}.tab{display:none;padding:12px}.tab.active{display:block}#tab-home{background:#0a1931!important;color:#fff!important;min-height:100vh}#tab-home h2,#tab-home h3,#tab-home p,#tab-home li{color:#fff!important}#videoWrap{position:relative}#videoBox{position:relative;width:100%;aspect-ratio:4/3;background:#000;border-radius:16px;overflow:hidden}#mp4Player,#ytPlayer{width:100%;height:100%;border:0;display:none}#ytPlayer{overflow:hidden}#ytPlayer iframe{width:100%;height:100%;transform:scale(1.08);pointer-events:none}#ytBlocker{position:absolute;inset:0;z-index:15;background:transparent}#ticker{position:absolute;bottom:0;left:0;right:0;background:rgba(255,204,0,.95);color:#000;padding:6px;font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;min-height:28px;z-index:20}#ticker:empty{display:none}#tickerText{display:inline-block;padding-left:100%;animation:scrollTicker 25s linear infinite}@keyframes scrollTicker{from{transform:translateX(0)}to{transform:translateX(-100%)}}#soundBtnTop{width:100%;padding:14px;background:#ffcc00;color:#000;border:0;border-radius:12px;font-weight:800;font-size:16px;margin:10px 0}#rotateBtn{position:absolute;bottom:30px;right:10px;background:rgba(0,0,0,.7);color:#fff;border:0;width:38px;height:38px;border-radius:50%;z-index:25}#bigPlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.4);color:#fff;font-size:60px;border:0;z-index:30;width:100%}#downloadRow{display:flex;gap:10px}#downloadRow a{flex:1}#downloadRow button{width:100%;padding:14px;border:0;border-radius:12px;background:#fff;color:#0a1931;font-weight:700}input{width:100%;padding:14px;margin:7px 0;border:1px solid #ddd;border-radius:12px;background:#fff;color:#000}button{cursor:pointer}#sendComment,#submitArtist,#startWatching{width:100%;padding:15px;border:0;border-radius:12px;background:#fff;color:#0a1931;font-weight:700}.comment{background:#162a4a;padding:10px;border-radius:12px;margin:8px 0;color:#fff}.audioItem{background:#f2f2f7;padding:12px;border-radius:12px;margin:10px 0;color:#111}body.dark .audioItem{background:#162a4a;color:#fff}#welcomeBox{position:fixed;inset:0;background:#0a1931;color:#fff;z-index:1000;display:flex;flex-direction:column;justify-content:center;padding:25px;text-align:center}#bottomNav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0a1931;padding:8px;gap:5px;z-index:100}#bottomNav button{flex:1;background:transparent;color:#aaa;border:0;padding:12px 4px;font-weight:700;font-size:12px;border-radius:10px}#bottomNav button.active{background:#fff;color:#0a1931}#errorBox{background:#ff3b30;color:#fff;padding:12px;border-radius:12px;margin:10px 0;font-weight:700;display:none}#statusBox{display:none!important}</style></head>
<body><div id="offlineBanner">⚠ You're offline - Showing Saved Videos - You Are Still Inside Hit TV</div>
<header id="topBar"><div><h1>Hit TV</h1><p id="liveDot">● LIVE</p></div><button id="settingsBtn">Settings</button></header>
<div id="settingsBox" class="hidden"><h3>Settings</h3><label>White / Black Mode <input type="checkbox" id="themeToggle"></label><button id="feedbackBtn">Send Us Feedback</button><button id="updateBtn">Check Updates</button><button id="tvBtn">Connect on TV</button><button id="closeSettings">Close</button></div>
<main>
<section id="tab-home" class="tab active"><button id="soundBtnTop">🔊 TAP FOR SOUND</button><div id="videoWrap"><div id="videoBox"><video id="mp4Player" playsinline muted autoplay></video><div id="ytPlayer"></div><div id="ytBlocker"></div><button id="bigPlay">▶</button><div id="ticker"><span id="tickerText"></span></div></div><button id="rotateBtn">⛶</button></div>
<div id="statusBox"></div>
<div id="errorBox"></div>
<div id="nowPlaying"><span>NOW PLAYING</span><h2 id="nowTitle">No video playing</h2><p id="nowArtist">Hit TV</p><p id="nowDesc"></p></div><div id="downloadRow"><a id="dlVideo" href="#" download><button>Download Video</button></a><a id="dlAudio" href="#" download><button>Download Audio</button></a></div><div><h3>Up Next</h3><ul id="queueList"></ul></div><div><h3>Comments</h3><div id="commentList"></div><input id="commentName" placeholder="Your name"><input id="commentText" placeholder="Say something..."><button id="sendComment">Send Comment</button></div></section>
<section id="tab-notif" class="tab"><h2>Inbox</h2><div id="notifList"></div></section>
<section id="tab-audio" class="tab"><h2>Audio Streams</h2><div id="audioList"></div></section>
<section id="tab-artist" class="tab"><h2>Artist Console</h2><input id="artistName" placeholder="Artist Name"><input id="artistPhone" placeholder="Phone / WhatsApp"><input id="artistTitle" placeholder="Song Title"><input id="artistLink" placeholder="YouTube / MP3 Link"><button id="submitArtist">Submit To Admin</button><p id="artistMsg"></p></section>
</main>
<div id="welcomeBox"><h1>Hit TV</h1><p>Enter your name to start watching</p><input id="userName" placeholder="Your Name"><button id="startWatching">START WATCHING</button></div>
<nav id="bottomNav"><button data-tab="home" class="active">Home</button><button data-tab="notif">Notifications</button><button data-tab="audio">Audio Streams</button><button data-tab="artist">Artist Console</button></nav>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
window.onerror=function(m){ let e=document.getElementById('errorBox'); if(e){ e.style.display='block'; e.textContent='JS ERROR: '+m; } };
try{ localStorage.removeItem('hitTV_cache_queue'); localStorage.removeItem('hitTV_last_video'); }catch(e){}
const firebaseConfig={apiKey:"AIzaSyAGzXyxBHmvBcWwoyWo4Xjn_1pGRyQjO_M",authDomain:"hittvapp1-29f3a.firebaseapp.com",projectId:"hittvapp1-29f3a",storageBucket:"hittvapp1-29f3a.firebasestorage.app",messagingSenderId:"567256630691",appId:"1:567256630691:web:5e6e22fe24416eb3270616",measurementId:"G-1JKDEMDGWT"};
try{ firebase.initializeApp(firebaseConfig); }catch(e){ document.getElementById('errorBox').style.display='block'; document.getElementById('errorBox').textContent='Firebase Init Failed: '+e.message; }
const db=firebase.firestore();
let queue=[], programs=[], currentIndex=0, isMuted=true, liveStatus='play', lastForce=-1, liveStartedAt=0, isPlaying=false, liveData=null, firebaseLoaded=false;
function showError(t){ let e=document.getElementById('errorBox'); e.style.display='block'; e.textContent=t; }
const video=document.getElementById('mp4Player'), ytBox=document.getElementById('ytPlayer'), bigPlay=document.getElementById('bigPlay');
function getYTId(u){ if(!u) return null; u=u.trim(); let m=u.match(/(?:v=|vi=|youtu\.be\/|shorts\/|live\/|embed\/)([A-Za-z0-9_-]{11})/); if(m) return m[1]; if(u.length===11) return u; return null; }
function getJoinOffset(){ if(!liveStartedAt) return 0; let off=Math.floor((Date.now()-liveStartedAt)/1000); if(off<0) off=0; if(off>10000) off=0; return off; }
function playItem(item, joinLive){ if(!item) return; let url=item.url||item.link||''; if(!url){ showError('This video has no URL - Admin must re-add it'); return; } isPlaying=true; bigPlay.style.display='none'; document.getElementById('nowTitle').textContent=item.title||'Hit TV'; document.getElementById('nowArtist').textContent=item.artist||'Hit TV'; document.getElementById('dlVideo').href=url; document.getElementById('dlAudio').href=item.audio||url; let offset = joinLive ? getJoinOffset() : 0; let isYT=(item.type==='youtube'||url.includes('youtube')||url.includes('youtu.be')); if(isYT){ video.style.display='none'; video.pause(); ytBox.style.display='block'; let id=getYTId(url); if(!id){ showError('Bad YouTube link: '+url); return; } ytBox.innerHTML=`<iframe id="ytFrame" width="100%" height="100%" src="https://www.youtube.com/embed/${id}?autoplay=1&mute=1&controls=0&rel=0&modestbranding=1&iv_load_policy=3&disablekb=1&fs=0&playsinline=1&enablejsapi=1&start=${offset}" allow="autoplay; encrypted-media" frameborder="0"></iframe>`; } else { ytBox.style.display='none'; ytBox.innerHTML=''; video.style.display='block'; video.src=url; video.controls=false; video.muted=true; video.play().then(()=>{ if(offset>0){ try{ video.currentTime=offset; }catch(e){} } }).catch(()=>{ bigPlay.style.display='flex'; }); video.onloadedmetadata=()=>{ if(offset>0){ try{ video.currentTime=offset; }catch(e){} } }; } renderQueue(); }
function playLive(){ if(!liveData) return; if(!liveData.url && !liveData.link) return; if(liveData.status==='stop') return; if(liveData.camera) return; isPlaying=false; playItem({title:liveData.title,artist:liveData.artist,url:liveData.url||liveData.link,type:liveData.type,audio:liveData.audio}, true); }
function tryPlay(){ if(liveData) { playLive(); return; } if(!queue.length) return; if(isPlaying) return; currentIndex=0; playItem(queue[0], true); }
function renderQueue(){ let list=document.getElementById('queueList'); if(!firebaseLoaded){ list.innerHTML='<li style="list-style:none;padding:12px;background:#162a4a;border-radius:10px">Loading...</li>'; return; } if(!queue.length){ list.innerHTML='<li style="list-style:none;padding:12px;background:#162a4a;border-radius:10px;color:#fff">No video coming next</li>'; return; } let nextIndex=currentIndex+1; if(nextIndex>=queue.length) nextIndex=0; let q=queue[nextIndex]; if(!q){ list.innerHTML='<li style="list-style:none">No video coming next</li>'; return; } list.innerHTML=`<li style="padding:12px;background:#162a4a;margin:5px 0;border-radius:10px;list-style:none"><b>Up Next: ${q.title||''}</b><br><small>${q.artist||''}</small></li>`; }
function checkProgram(){let now=new Date().toLocaleTimeString('en-GB',{timeZone:'Africa/Kampala',hour:'2-digit',minute:'2-digit'}); let p=programs.find(x=>x.time===now); if(p){playItem(p,false); return true;} return false;}
function nextSong(){if(checkProgram()) return; currentIndex++; if(currentIndex>=queue.length) currentIndex=0; if(queue[currentIndex]) playItem(queue[currentIndex],false);}
video.onended=nextSong;
bigPlay.onclick=()=>{ bigPlay.style.display='none'; isPlaying=false; if(liveData) playLive(); else if(queue[currentIndex]) playItem(queue[currentIndex], true); if(video.style.display==='block') video.play().catch(()=>{}); };
renderQueue();
db.collection('hitTV_queue').onSnapshot(s=>{ firebaseLoaded=true; queue=s.docs.map(d=>d.data()); renderQueue(); if(!liveData) tryPlay(); },e=>{ firebaseLoaded=true; renderQueue(); showError('FIREBASE ERROR: '+e.message); });
// LIVE IS KING - PLAY IMMEDIATELY FROM LIVE DOC, DO NOT WAIT FOR QUEUE
db.collection('hitTV').doc('live').onSnapshot(d=>{if(!d.exists) return; let v=d.data(); liveData=v; liveStatus=v.status||'play'; if(v.ticker){ let t=document.getElementById('tickerText'); if(t.textContent!==v.ticker){ t.textContent=v.ticker; t.style.animation='none'; void t.offsetWidth; t.style.animation=''; } } if(v.title) document.getElementById('nowTitle').textContent=v.title; if(v.artist) document.getElementById('nowArtist').textContent=v.artist; if(v.desc) document.getElementById('nowDesc').textContent=v.desc; if(v.startedAt) liveStartedAt=v.startedAt; else if(v.updated) liveStartedAt=v.updated; if(v.url||v.link){ if(v.force!==undefined && v.force!==lastForce){ lastForce=v.force; if(v.status!=='stop' && !v.camera){ isPlaying=false; playItem({title:v.title,artist:v.artist,url:v.url||v.link,type:v.type,audio:v.audio}, true); } } else if(!isPlaying){ playLive(); } } if(v.camera){video.style.display='none'; ytBox.style.display='none';} if(liveStatus==='stop'){video.pause(); ytBox.innerHTML='';} });
db.collection('hitTV_programs').onSnapshot(s=>{programs=s.docs.map(d=>d.data());});
db.collection('hitTV_audio').onSnapshot(s=>{document.getElementById('audioList').innerHTML=s.docs.map(d=>{let a=d.data(); return `<div class="audioItem"><div><b>${a.title}</b><br><small>${a.artist}</small><br><audio controls src="${a.url}" style="width:200px"></audio></div><a href="${a.url}" download><button style="padding:10px;background:#0a1931;color:#fff;border:0;border-radius:10px">Download</button></a></div>`}).join('')||'<p>No audio yet</p>';});
db.collection('hitTV_notif').onSnapshot(s=>{let arr=s.docs.map(d=>d.data()).sort((a,b)=>(b.time||0)-(a.time||0)); document.getElementById('notifList').innerHTML=arr.map(n=>`<div class="comment"><b>${n.title}</b><br>${n.text}</div>`).join('')||'<p>No messages</p>';});
db.collection('hitTV_comments').onSnapshot(s=>{let arr=s.docs.map(d=>d.data()).sort((a,b)=>(b.time||0)-(a.time||0)).slice(0,20); document.getElementById('commentList').innerHTML=arr.map(c=>`<div class="comment"><b>${c.name}</b><br>${c.text}</div>`).join('')||'<p>No comments</p>';});
setInterval(()=>{if(checkProgram()){}},20000);
setInterval(()=>{ if(liveData && !isPlaying) playLive(); },3000);
document.querySelectorAll('#bottomNav button').forEach(b=>{b.onclick=()=>{document.querySelectorAll('#bottomNav button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); document.getElementById('tab-'+b.dataset.tab).classList.add('active');};});
function toggleSound(){ isMuted=!isMuted; let btn=document.getElementById('soundBtnTop'); btn.textContent=isMuted?'🔊 TAP FOR SOUND':'🔇 TAP TO MUTE'; if(video.style.display==='block'){ video.muted=isMuted; } else { let frame=document.getElementById('ytFrame'); if(frame && frame.contentWindow){ frame.contentWindow.postMessage(JSON.stringify({event:'command',func:isMuted?'mute':'unMute',args:''}), '*'); } } }
document.getElementById('soundBtnTop').onclick=toggleSound;
document.getElementById('rotateBtn').onclick=()=>{let box=document.getElementById('videoBox'); if(document.fullscreenElement) document.exitFullscreen(); else box.requestFullscreen().catch(()=>{});};
document.getElementById('settingsBtn').onclick=()=>document.getElementById('settingsBox').classList.toggle('hidden');
document.getElementById('closeSettings').onclick=()=>document.getElementById('settingsBox').classList.add('hidden');
document.getElementById('themeToggle').onchange=e=>{document.body.classList.toggle('dark',e.target.checked); localStorage.setItem('hitTV_theme',e.target.checked?'dark':'light');};
if(localStorage.getItem('hitTV_theme')==='dark'){document.body.classList.add('dark'); document.getElementById('themeToggle').checked=true;}
document.getElementById('feedbackBtn').onclick=async()=>{let f=prompt('Feedback:'); if(f) await db.collection('hitTV_feedback').add({name:localStorage.getItem('hitTV_name')||'Viewer',text:f,time:Date.now()}); alert('Sent');};
document.getElementById('updateBtn').onclick=()=>alert('Hit TV v1.0 Up to date');
document.getElementById('tvBtn').onclick=()=>alert('Open Hit TV on TV browser');
document.getElementById('sendComment').onclick=async()=>{let n=document.getElementById('commentName').value||localStorage.getItem('hitTV_name')||'Viewer'; let t=document.getElementById('commentText').value; if(!t) return alert('Write comment'); await db.collection('hitTV_comments').add({name:n,text:t,time:Date.now()}); document.getElementById('commentText').value='';};
document.getElementById('submitArtist').onclick=async()=>{let d={name:document.getElementById('artistName').value,phone:document.getElementById('artistPhone').value,title:document.getElementById('artistTitle').value,link:document.getElementById('artistLink').value,time:Date.now()}; if(!d.name||!d.title) return alert('Fill Name + Title'); await db.collection('hitTV_artist').add(d); document.getElementById('artistMsg').textContent='Submitted! Admin will review.';};
document.getElementById('startWatching').onclick=()=>{ let n=document.getElementById('userName').value.trim(); if(!n) return alert('Enter name'); localStorage.setItem('hitTV_name',n); document.getElementById('welcomeBox').classList.add('hidden'); document.getElementById('commentName').value=n; try{ db.collection('hitTV_users').doc(n).set({name:n,lastSeen:Date.now()},{merge:true}); }catch(e){} isPlaying=false; if(liveData) playLive(); else tryPlay(); if(video.style.display==='block') video.play().catch(()=>{}); };
setInterval(async()=>{let n=localStorage.getItem('hitTV_name'); if(n) try{await db.collection('hitTV_users').doc(n).set({name:n,lastSeen:Date.now()},{merge:true});}catch(e){}},30000);
if(localStorage.getItem('hitTV_name')){document.getElementById('welcomeBox').classList.add('hidden'); document.getElementById('commentName').value=localStorage.getItem('hitTV_name');}
function updateOnline(){document.body.classList.toggle('offline',!navigator.onLine);} window.addEventListener('online',updateOnline); window.addEventListener('offline',updateOnline); updateOnline();
</script></body></html>
