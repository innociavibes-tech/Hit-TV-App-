<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HIT TV APP</title>
<link rel="icon" href="logo.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0a1628;color:#fff;padding-bottom:70px}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 14px}
.logo-row{display:flex;align-items:center;gap:10px}
.logo-img{width:56px;height:56px;border-radius:14px;object-fit:cover}
.logo-text{font-weight:900;font-size:20px} .logo-text span{color:#00aaff} .logo-text small{font-size:10px;color:#888;font-weight:400}
.online{font-size:11px;color:#00ff88}
.badge{background:#ff2222;font-size:11px;font-weight:900;padding:4px 8px;border-radius:6px;display:inline-block;margin:10px 14px}
.video-wrap{padding:0 14px}
.video-box{width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;position:relative}
/* FIXED CSS - VIDEO CAN PLAY NOW */
.video-box video{width:100%;height:100%;display:block;background:#000;position:relative;z-index:2}
.video-box iframe{width:100%;height:100%;border:0;display:none;position:relative;z-index:3}
#noVideo{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:18px;background:#000;z-index:1}
#noVideo small{font-size:12px;color:#888;font-weight:400;margin-top:6px}
.title{padding:12px 14px} .title b{font-size:15px} .title p{font-size:12px;color:#aaa;margin-top:3px}
.comments{margin:14px;background:#12233f;border-radius:12px;padding:12px}
.msg{background:#0a1628;padding:8px 10px;border-radius:8px;margin-top:8px;font-size:12px}
.row{display:flex;gap:8px;margin-top:10px}
.row input{flex:1;background:#0a1628;border:1px solid #2a4a6f;color:#fff;padding:9px;border-radius:8px;outline:none}
.row button{background:#00aaff;border:0;color:#fff;padding:9px 14px;border-radius:8px;font-weight:700}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#0a1628;display:flex;justify-content:space-around;padding:12px 0 10px;border-top:1px solid #1e3a5f}
.bottom div{text-align:center;font-size:11px;color:#888;font-weight:700;letter-spacing:0.5px;cursor:pointer}
.bottom div.active{color:#fff}
.bottom div.active .tab-line{opacity:1}
.tab-icon{width:22px;height:22px;margin:0 auto 4px;display:block;fill:none;stroke:currentColor;stroke-width:1.8}
.tab-line{width:22px;height:3px;background:#00aaff;border-radius:3px;margin:4px auto 0;opacity:0}
</style>
</head>
<body>

<div class="top">
  <div class="logo-row">
    <img src="logo.png" class="logo-img">
    <div class="logo-text">HIT <span>TV</span><br><small>APP</small></div>
  </div>
  <div class="online">● Online</div>
</div>

<div class="badge">● LIVE</div>

<div class="video-wrap">
  <div class="video-box">
    <div id="noVideo">HIT TV LIVE<small>Waiting for live video...</small></div>
    <video id="liveVideo" autoplay muted playsinline preload="auto"></video>
    <iframe id="ytFrame" allow="autoplay; encrypted-media" allowfullscreen></iframe>
  </div>
</div>

<div class="title"><b id="liveTitle">Hit TV Live</b><p id="liveDesc">Live from Kampala - Hit TV</p></div>

<div class="comments"><b>Live Comments</b>
  <div id="commentList"><div class="msg"><b>Hit TV:</b> Welcome to live comments</div></div>
  <div class="row"><input id="commentInput" placeholder="Write a comment..."><button onclick="sendComment()">Send</button></div>
</div>

<div class="bottom">
  <div class="active"><svg class="tab-icon" viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5V21H3z"/><path d="M9 21v-6h6v6"/></svg>HOME<div class="tab-line"></div></div>
  <div><svg class="tab-icon" viewBox="0 0 24 24"><path d="M18 9a6 6 0 1 0-12 0c0 6-2 7-2 7h16s-2-1-2-7"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>NOTIFICATIONS<div class="tab-line"></div></div>
  <div><svg class="tab-icon" viewBox="0 0 24 24"><path d="M9 18V6l12-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>AUDIO<div class="tab-line"></div></div>
  <div><svg class="tab-icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-6 8-6s8 2 8 6"/></svg>ARTIST<div class="tab-line"></div></div>
</div>

<script>
const DB = "https://hit-tv-app-40fb9-default-rtdb.firebaseio.com";
function getId(url){
  if(!url) return "";
  let m = url.match(/(?:youtu\.be\/|v=|shorts\/|embed\/|live\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : "";
}
function show(url, title, desc){
  document.getElementById('liveTitle').innerText = title || "Hit TV Live";
  document.getElementById('liveDesc').innerText = desc || "Live from Kampala - Hit TV";
  let vid = document.getElementById('liveVideo');
  let yt = document.getElementById('ytFrame');
  let no = document.getElementById('noVideo');
  let id = getId(url);
  if(id){
    vid.style.display = "none"; vid.pause();
    no.style.display = "none";
    yt.style.display = "block";
    let newSrc = "https://www.youtube.com/embed/" + id + "?autoplay=1&mute=1&playsinline=1&controls=0&rel=0&modestbranding=1";
    if(yt.src !== newSrc) yt.src = newSrc;
  } else if(url){
    yt.style.display = "none"; yt.src = "";
    no.style.display = "none";
    vid.style.display = "block";
    if(vid.src !== url) vid.src = url;
    vid.muted = true;
    vid.play().catch(()=>{});
  } else {
    yt.style.display = "none"; yt.src = "";
    vid.style.display = "none";
    no.style.display = "flex";
  }
}
function sendComment(){
  let inp = document.getElementById('commentInput');
  if(!inp.value.trim()) return;
  let d = document.createElement('div');
  d.className = 'msg';
  d.innerHTML = '<b>You:</b> ' + inp.value;
  document.getElementById('commentList').appendChild(d);
  inp.value = "";
}
async function load(){
  try{
    let r = await fetch(DB + "/config.json");
    let data = await r.json();
    if(data) show(data.liveUrl, data.liveTitle, data.liveDesc);
  }catch(e){}
}
load();
setInterval(load, 5000);
// Tap video to unmute / play - if browser blocked autoplay
document.getElementById('liveVideo').addEventListener('click', function(){ this.muted=false; this.play(); });
</script>
</body>
    </html>
