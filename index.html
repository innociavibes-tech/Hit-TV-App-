<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HIT TV APP</title>
<link rel="icon" href="logo.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0a1628;color:#fff;padding-bottom:70px}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 14px}
.logo-row{display:flex;align-items:center;gap:8px}
.logo-img{width:42px;height:42px;border-radius:10px;object-fit:cover}
.logo-text{font-weight:900;font-size:18px;line-height:1} .logo-text span{color:#00aaff} .logo-text small{font-size:10px;color:#888;font-weight:400}
.online{font-size:11px;color:#00ff88}
.live-badge{background:#ff2222;color:#fff;font-size:11px;font-weight:900;padding:4px 8px;border-radius:6px;display:inline-block;margin:10px 14px}
.video-wrap{padding:0 14px}
video,iframe{width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;display:block;pointer-events:none}
#youtubePlayer{display:none;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000;pointer-events:none}
.live-title{padding:12px 14px}
.live-title b{font-size:15px} .live-title p{font-size:12px;color:#aaa;margin-top:3px}
.comments{margin:14px;background:#12233f;border-radius:12px;padding:12px}
.comments b{font-size:13px}
.msg{background:#0a1628;padding:8px 10px;border-radius:8px;margin-top:8px;font-size:12px}
.input-row{display:flex;gap:8px;margin-top:10px}
.input-row input{flex:1;background:#0a1628;border:1px solid #2a4a6f;color:#fff;padding:9px;border-radius:8px;outline:none}
.input-row button{background:#00aaff;border:0;color:#fff;padding:9px 14px;border-radius:8px;font-weight:700}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#0a1628;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #1e3a5f}
.bottom div{text-align:center;font-size:11px;color:#888;cursor:pointer}
.bottom div.active{color:#00aaff}
</style>
</head>
<body>
<div class="top">
  <div class="logo-row">
    <img src="logo.png" class="logo-img" alt="Hit TV">
    <div class="logo-text">HIT <span>TV</span><br><small>APP</small></div>
  </div>
  <div class="online">● Online</div>
</div>
<div class="live-badge">● LIVE</div>
<div class="video-wrap">
  <!-- LIVE VIDEO - NO BUTTON, NO CONTROLS, AUTO PLAY ONLY -->
  <video id="liveVideo" autoplay muted playsinline preload="auto" disablepictureinpicture controlslist="nodownload noplaybackrate noremoteplayback"></video>
  <!-- YOUTUBE LIVE - NO BUTTON, NO CONTROLS -->
  <div id="youtubePlayer"><iframe id="youtubeFrame" frameborder="0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>
</div>
<div class="live-title"><b id="liveTitle">Hit TV Live - Morning Show</b><p id="liveDesc">Live from Kampala - Hit TV</p></div>
<div class="comments"><b>Live Comments</b><div id="commentList"><div class="msg"><b>Hit TV:</b> Welcome to live comments</div></div><div class="input-row"><input id="commentInput" placeholder="Write a comment..."><button onclick="sendComment()">Send</button></div></div>
<div class="bottom"><div class="active">🏠<br>Home</div><div>🔔<br>Notifications</div><div>🎵<br>Audio</div><div>👤<br>Artist</div></div>
<script src="app.js"></script>
</body>
</html>
