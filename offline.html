<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hit TV by Inno - Offline</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
/* DEFAULT = DARK */
:root{
  --bg:#0a0a0a; --card:#111; --border:#222; --text:#fff; --sub:#aaa; --small:#666; --footer:#555; --barBg:#1a1a1a;
}
/* LIGHT MODE - When user phone is on White / Light */
@media (prefers-color-scheme: light){
  :root{
    --bg:#f5f5f5; --card:#ffffff; --border:#ddd; --text:#111; --sub:#555; --small:#888; --footer:#999; --barBg:#e5e5e5;
  }
}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;transition:background .3s,color .3s}
.logo{font-size:28px;font-weight:900;letter-spacing:-0.5px}
.logo span{color:#1a2fd6}
.sub{color:var(--sub);font-size:12px;margin-top:4px;letter-spacing:2px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px 20px;margin-top:28px;width:100%;max-width:340px;transition:background .3s}
.dot{width:14px;height:14px;background:#ff6600;border-radius:50%;display:inline-block;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.2}}
.title{font-size:19px;font-weight:800;margin-top:12px}
.desc{color:var(--sub);font-size:14px;line-height:1.5;margin-top:8px}
.btn{width:100%;background:#0033cc;color:#fff;border:none;padding:15px;border-radius:12px;font-weight:800;font-size:15px;margin-top:18px;cursor:pointer}
.btn:active{opacity:.8}
.small{color:var(--small);font-size:11px;margin-top:16px;line-height:1.5}
.footer{margin-top:28px;color:var(--footer);font-size:11px}
.bar{width:100%;max-width:340px;background:var(--barBg);border-radius:20px;height:6px;margin-top:16px;overflow:hidden}
.bar div{height:100%;width:40%;background:#ff6600;border-radius:20px;animation:load 1.2s infinite}
@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
</style>
</head>
<body>

<div class="logo">Hit TV <span>by Inno</span></div>
<div class="sub">LIVE • 24/7</div>

<div class="card">
<span class="dot"></span>
<div class="title">You're Offline</div>
<p class="desc">No internet connection.<br>Don't close the app.<br>Hit TV will load by itself when you're back online.</p>
<div class="bar"><div></div></div>
<button class="btn" onclick="tryReload()">🔄 TRY AGAIN</button>
<p class="small" id="statusText">Checking connection...</p>
</div>

<div class="footer">Hit TV by Inno • Stay Tuned</div>

<script>
function tryReload(){
  document.getElementById('statusText').innerText = 'Trying to reconnect...';
  try{ window.location.href = 'median://reload'; }catch(e){}
  setTimeout(function(){
    if(navigator.onLine){ window.location.href = 'index.html'; location.reload(); }
    else { document.getElementById('statusText').innerText = 'Still offline. Will retry automatically...'; }
  }, 1500);
}
window.addEventListener('online', tryReload);
setInterval(function(){ if(navigator.onLine){ tryReload(); } }, 3000);

// Listen for system theme change live
if(window.matchMedia){
  window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', function(){
    // CSS will auto-change, no reload needed
  });
}
</script>

</body>
</html>
